apply plugin: 'com.android.application'

android {
    namespace = "com.kigatta.ingo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // The Play listing (468 installs, Production since 2026-05-20) is
        // com.world.fi.ingo. The Java package and namespace stay com.kigatta.ingo;
        // only this id is the app's identity on Play and in Firebase.
        applicationId "com.world.fi.ingo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Google Play refuses an upload whose versionCode is not higher than the one
        // already on the listing. Check Play Console -> Release -> Production ->
        // "App bundles" before every release and raise this past that number.
        versionCode 8
        versionName "1.1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing. The upload key lives OUTSIDE the repo in
    // android/keystore.properties (gitignored; template in keystore.properties.example).
    // Without the file a release build still succeeds but is UNSIGNED, which Google
    // Play rejects at upload -- so a missing key cannot ship by accident, and the
    // pipeline can still be exercised on a machine that does not hold the key.
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def keystoreProperties = new Properties()
    def hasUploadKey = keystorePropertiesFile.exists()
    if (hasUploadKey) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    } else {
        logger.warn("android/keystore.properties not found: release artefacts will be UNSIGNED and Google Play will refuse them.")
    }
    signingConfigs {
        release {
            if (hasUploadKey) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // OfferMessagingService subclasses the push plugin's FirebaseMessagingService.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    // Capacitor's default here is logger.info, which is invisible at normal Gradle
    // verbosity. That is not a warning, it is a trap: without this file,
    // PushNotificationsPlugin.register() throws
    //   IllegalStateException: Default FirebaseApp is not initialized
    // on the CapacitorPlugins thread, which JS cannot catch, and the process dies.
    // Observed on device 2026-09-02: a driver signing in crashed the app.
    //
    // Debug builds may proceed without the file so push can be worked on locally.
    // A RELEASE build without it would ship an app that crashes on driver sign-in,
    // so it fails here, loudly, where a developer sees it.
    def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if (wantsRelease) {
        throw new GradleException(
            "android/app/google-services.json is missing. A release build without it " +
            "crashes on driver sign-in (FirebaseApp not initialized in " +
            "PushNotificationsPlugin.register). Add the file from the Firebase project " +
            "that owns this app id, or build debug for local work."
        )
    }
    logger.warn("google-services.json not found: push notifications will NOT work, and driver sign-in will crash. Debug build only.")
}
